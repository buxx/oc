name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Bevy (and bevy_hanabi, which only needs wgpu) Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build all binaries
        run: cargo build --release --workspace --bins

      - name: Package
        shell: bash
        run: |
          name="oc-${{ github.ref_name }}-${{ runner.os }}"
          mkdir "$name"
          # Executables only (no .d files, no build dirs)
          find target/release -maxdepth 1 -type f \( -perm -u+x -o -name '*.exe' \) \
            ! -name '*.so' ! -name '*.dll' ! -name '*.d' -exec cp {} "$name"/ \;
          cp -r mods examples "$name"/
          # assets/mods_ and assets/worlds_ are dev symlinks to ../mods and ../examples: skip them (not portable to Windows)
          mkdir "$name/assets"
          for f in assets/* assets/.keep; do
            case "$f" in assets/mods_|assets/worlds_) ;; *) cp -r "$f" "$name/assets/" ;; esac
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes
