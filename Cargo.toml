[workspace]
resolver = "2"
members = ["crates/*"]

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
debug = true

[workspace.dependencies]
bevy = "0.19"
bevy_spritesheet_animation = "7"
derive_more = "2"
thiserror = "2"
anyhow = "1"
rayon = "1"
rustc-hash = "2"
rkyv = "0.8"
num_cpus = "1"
message-io = "0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
line_drawing = "1"
image = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1"
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
serde_derive = "1.0"
axum = "0.8"
tokio = "1"
tokio-util = "0.7"
reqwest = "0.13"
bevy_egui = "0.41"
egui_dock = "0.20"
strum = "0.28"
strum_macros = "0.28"
ron = "0.12"
tar = "0.4"
flate2 = "1"
glam = "0.33"  # version stucked by polyanya requirements
fastrand = "2"
bon = "3.9"
fs_extra = "1"
tempfile = "3"
tiled = "0.10.2"
geo = "0.33"
ctrlc = "3"
polyanya = { git = "https://github.com/buxx/polyanya.git", branch = "main" }  # Forked to solve glam version conflict
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
backtrace = "0.3"

# tests
rstest = "0.26"
