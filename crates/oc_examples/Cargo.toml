[package]
name = "oc_examples"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
debug = ["oc_network/debug", "oc_world_server/debug", "oc_world/debug", "oc_battle_gui/debug", "oc_root/debug"]
perfs = ["oc_world_server/perfs"]
debug_locks = ["oc_utils/debug"]
test = ["debug", "oc_world_server/tracker"]

# No tests in these bins: skip building them with the test harness (350Mo each)
[lib]
test = false
doctest = false

[[bin]]
name = "example_engaging"
path = "src/bin/example_engaging.rs"
test = false

[[bin]]
name = "example_height"
path = "src/bin/example_height.rs"
test = false

[[bin]]
name = "example_individual_behaviors"
path = "src/bin/example_individual_behaviors.rs"
test = false

[[bin]]
name = "example_individual_shots"
path = "src/bin/example_individual_shots.rs"
test = false

[[bin]]
name = "example_interiors"
path = "src/bin/example_interiors.rs"
test = false

[[bin]]
name = "example_minidblue"
path = "src/bin/example_minidblue.rs"
test = false

[[bin]]
name = "example_projectiles_obstacles"
path = "src/bin/example_projectiles_obstacles.rs"
test = false

[[bin]]
name = "example_regions"
path = "src/bin/example_regions.rs"
test = false

[[bin]]
name = "example_stress"
path = "src/bin/example_stress.rs"
test = false

[[bin]]
name = "example_stress_projectiles"
path = "src/bin/example_stress_projectiles.rs"
test = false

[[bin]]
name = "example_stress_projectiles_server"
path = "src/bin/example_stress_projectiles_server.rs"
test = false

[[bin]]
name = "example_visibilities"
path = "src/bin/example_visibilities.rs"
test = false

[[bin]]
name = "example_weapons"
path = "src/bin/example_weapons.rs"
test = false

[[bin]]
name = "example_world"
path = "src/bin/example_world.rs"
test = false

[[bin]]
name = "example_world1"
path = "src/bin/example_world1.rs"
test = false

[dependencies]
oc_root = { path = "../oc_root", features = ["clap"] }
oc_world_server = { path = "../oc_world_server" }
oc_world = { path = "../oc_world" }
oc_network = { path = "../oc_network" }
oc_individual = { path = "../oc_individual" }
oc_projectile = { path = "../oc_projectile" }
oc_physics = { path = "../oc_physics" }
oc_geo = { path = "../oc_geo" }
oc_utils = { path = "../oc_utils" }
oc_mod = { path = "../oc_mod" }
oc_battle_gui = { path = "../oc_battle_gui" }
oc_deployment = { path = "../oc_deployment" }
tests = { path = "../tests" }
tracing.workspace = true
tracing-subscriber.workspace = true
bon.workspace = true
tempfile.workspace = true
thiserror.workspace = true
anyhow.workspace = true
derive_more.workspace = true
bevy.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
parking_lot.workspace = true
uuid.workspace = true
